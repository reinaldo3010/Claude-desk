<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provas dos 24 modelos esportivos — Panda Mimo</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:32px;background:var(--paper);color:var(--ink)}main{max-width:1320px;margin:auto}h1,h2{font-family:Fredoka,sans-serif}h1{font-size:36px}p{margin:16px 0}select{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--kraft);background:var(--white)}#modelos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}article{padding:18px;border:1px solid var(--sand);border-radius:16px;background:var(--white)}h2{font-size:20px}canvas{width:100%;height:auto}small{color:var(--sage-deep)}@media(max-width:760px){body{padding:16px}#modelos{grid-template-columns:1fr}}
</style>
<main><h1>Esportes e movimento</h1><p>24 modelos nativos · fotos, frases e ilustrações em camadas. Estas provas usam o mesmo desenho do editor.</p><label for="categoria">Modalidade </label><select id="categoria"><option value="todos">Todas as modalidades</option></select><p><a href="../caneca-3d.html">Abrir o estúdio para personalizar</a></p><section id="modelos" aria-label="Provas das artes"></section></main>
<script type="module">
import {MODELOS_ESPORTES,CATEGORIAS_ESPORTES} from '../simulador/esportes-dados.js';
import {novaArte,desenhaArte} from '../simulador/modelos.js';
await document.fonts.ready;
await Promise.all(['600 14px Fredoka','600 14px Nunito','600 14px Caveat'].map(f=>document.fonts.load(f)));
const filter=document.getElementById('categoria'),container=document.getElementById('modelos');
for(const c of CATEGORIAS_ESPORTES){const o=document.createElement('option');o.value=c.id;o.textContent=c.nome;filter.append(o);}
function draw(){container.replaceChildren();for(const m of MODELOS_ESPORTES.filter(m=>filter.value==='todos'||m.categoria===filter.value)){
 const card=document.createElement('article'),title=document.createElement('h2'),desc=document.createElement('small'),canvas=document.createElement('canvas');
 title.textContent=m.nome;desc.textContent=`${m.id} · ${m.camadas.length} camadas editáveis`;
 canvas.width=1260;canvas.height=540;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',m.nome+' — arte aberta');
 const ctx=canvas.getContext('2d');ctx.scale(6,6);desenhaArte(ctx,novaArte(m),{x:0,y:0,width:210,height:90});
 card.append(title,desc,canvas);container.append(card);
}}
filter.addEventListener('change',draw);draw();
</script>
</html>
