<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Panda Mimo</title>
  <meta name="robots" content="noindex">
  <!-- endereços absolutos de propósito: o GitHub Pages mostra esta página em qualquer caminho que não exista -->
  <link rel="icon" href="https://reinaldo3010.github.io/Claude-desk/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://reinaldo3010.github.io/Claude-desk/styles.css">
  <style>
    .erro { min-height: 100vh; display: grid; place-items: center; padding: 2rem var(--gutter); text-align: center; }
    .erro img { width: min(60vw, 260px); height: auto; margin: 0 auto .6rem; }
    .erro h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.8rem, 1.4rem + 1.8vw, 2.6rem); margin: .4rem 0 .6rem; }
    .erro h1 .hand { font-size: 1.05em; }
    .erro p { max-width: 46ch; color: var(--ink-soft); margin: 0 auto 1.4rem; }
    .erro .acoes { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
<main class="erro">
  <div>
    <img src="https://reinaldo3010.github.io/Claude-desk/assets/panda-dormindo.webp" alt="Pandinha dormindo" width="900" height="562">
    <p class="eyebrow"><span class="eyebrow__dot"></span> Página não encontrada <span class="eyebrow__dot"></span></p>
    <h1>Essa página tirou <span class="hand">uma soneca.</span></h1>
    <p>O endereço não existe ou mudou de lugar. Volta pro início que a gente te mostra os mimos.</p>
    <div class="acoes">
      <a class="btn btn--dark" href="https://reinaldo3010.github.io/Claude-desk/">Voltar pro início</a>
      <a class="btn btn--ghost" href="https://reinaldo3010.github.io/Claude-desk/#produtos">Ver as peças</a>
    </div>
  </div>
</main>
</body>
</html>
